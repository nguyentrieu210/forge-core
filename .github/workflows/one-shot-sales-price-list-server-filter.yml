name: One-shot Sales Order server-filtered Price List fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sales-price-list-server-filter.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch Sales Order Price List selection
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          grep -F 'filters: { enabled: 1, selling: 1 }' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          grep -F 'orderBy: "modified desc"' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          grep -F 'pageLength: 1' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sales-price-list-server-filter.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "fix(ui): select latest active selling Price List server-side"
          git push origin HEAD:main
