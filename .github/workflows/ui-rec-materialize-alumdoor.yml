name: UI REC Materialize AlumDoor Metadata

on:
  push:
    branches:
      - program/backend-ui-reconciliation-20260811
    paths:
      - "server/scripts/lib/alumdoor-child-presentation.mjs"
      - "server/tests/alumdoor-internal-surface-contract.test.mjs"
      - ".github/workflows/ui-rec-materialize-alumdoor.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize canonical AlumDoor V2 brief
        run: node server/scripts/build-alumdoor-v2-brief.mjs
      - name: Verify generated internal-field contract
        run: node --test server/tests/alumdoor-internal-surface-contract.test.mjs server/tests/alumdoor-child-presentation.test.mjs server/tests/alumdoor-ui-rec-convergence-metadata.test.mjs
      - name: Commit generated brief
        run: |
          git diff --check
          if git diff --quiet -- server/briefs/alumdoor-v2.json; then
            echo "AlumDoor V2 metadata already materialized"
            exit 0
          fi
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add server/briefs/alumdoor-v2.json
          git commit -m "chore(meta): materialize final child presentation contract"
          git push origin "HEAD:program/backend-ui-reconciliation-20260811"
