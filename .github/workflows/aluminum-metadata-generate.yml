name: Alumdoor Aluminum Metadata Generate

on:
  pull_request:
    branches: [main]
    paths:
      - "server/briefs/alumdoor-v2.json"
      - "server/scripts/lib/alumdoor-child-presentation.mjs"
      - "server/briefs/alumdoor-v2.integrations.json"
      - "server/tests/alumdoor-ui-rec-convergence-metadata.test.mjs"
      - ".github/workflows/aluminum-metadata-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'program/backend-ui-reconciliation-20260811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Materialize canonical AlumDoor V2 metadata
        run: node server/scripts/build-alumdoor-v2-brief.mjs
      - name: Verify focused metadata regression
        run: node --test server/tests/alumdoor-ui-rec-convergence-metadata.test.mjs server/tests/alumdoor-child-presentation.test.mjs
      - name: Commit generated V2 metadata to coordinator branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git diff --check
          if git diff --quiet -- server/briefs/alumdoor-v2.json; then
            echo "Canonical AlumDoor V2 metadata already committed"
            exit 0
          fi
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add server/briefs/alumdoor-v2.json
          git commit -m "chore(meta): materialize UI reconciliation metadata"
          git push origin "HEAD:${HEAD_BRANCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-rec-alumdoor-v2-${{ github.run_id }}
          path: server/briefs/alumdoor-v2.json
          retention-days: 7
