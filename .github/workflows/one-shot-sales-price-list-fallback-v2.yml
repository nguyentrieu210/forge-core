name: One-shot Sales Order price-list fallback fix v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sales-price-list-fallback-v2.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch file
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          grep -F 'frappe.client.get_list' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sales-price-list-fallback-v2.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "fix(ui): harden latest active Sales price list default"
          git push origin HEAD:main
