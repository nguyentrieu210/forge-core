name: Sales Commercial Downstream Apply

on:
  pull_request:
    branches:
      - exp/alumdoor-pricing-policy

permissions:
  contents: write

concurrency:
  group: sales-commercial-downstream-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sales-commercial-complete-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply downstream contract
        working-directory: server
        run: node scripts/apply-sales-downstream-controllers.mjs
      - name: Build before commit
        working-directory: server
        run: pnpm run build
      - name: Run O2C regression
        working-directory: server
        run: node --test tests/o2c.test.mjs tests/sales-order-transaction-closure.test.mjs
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "Forge Sales Implementation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/packages server/scripts
          git commit -m "feat(sales): freeze invoice and enforce line fulfillment [skip ci]"
          git pull --rebase origin feat/sales-commercial-complete-20260811
          git push origin HEAD:feat/sales-commercial-complete-20260811
