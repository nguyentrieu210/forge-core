name: UI REC 01 Broad Meta Validation 2026-08-11

on:
  push:
    branches:
      - agent/ui-rec-01-backend-meta-20260811

permissions:
  contents: write

concurrency:
  group: ui-rec-01-broad-validation-20260811
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate first-party meta and persist evidence
        shell: bash
        run: |
          set +e
          {
            echo '$ cd server && pnpm run build'
            cd server
            pnpm run build
            echo
            echo '$ pnpm run verify:first-party-meta'
            pnpm run verify:first-party-meta
            echo
            echo '$ pnpm run brief:check'
            pnpm run brief:check
            echo
            echo '$ node --test tests/backend-ui-reconciliation.test.mjs tests/backend-ui-contract-validator.test.mjs'
            node --test tests/backend-ui-reconciliation.test.mjs tests/backend-ui-contract-validator.test.mjs
            cd ..
            echo
            echo '$ git diff --check'
            git diff --check
          } > /tmp/ui-rec-01-broad-validation.log 2>&1
          rc=$?
          set -e

          result=PASS
          if [ "$rc" -ne 0 ]; then result=FAIL; fi
          mkdir -p docs/agents/backend-ui-reconciliation
          {
            echo '# UI-REC-01 — BROAD META CI EVIDENCE'
            echo
            echo "Validated head: \`${GITHUB_SHA}\`"
            echo "Runner: \`${RUNNER_OS}\` / Node 24 / pnpm 9.15.0"
            echo "Result: **${result}**"
            echo
            echo '```text'
            cat /tmp/ui-rec-01-broad-validation.log
            echo '```'
          } > docs/agents/backend-ui-reconciliation/UI-REC-01-BROAD-CI-EVIDENCE.md

          git config user.name 'Forge UI-REC Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/agents/backend-ui-reconciliation/UI-REC-01-BROAD-CI-EVIDENCE.md
          git commit -m "ci(ui-rec-01): record broad meta validation ${result} [skip ci]" || true
          git push origin HEAD:agent/ui-rec-01-backend-meta-20260811
          exit "$rc"
