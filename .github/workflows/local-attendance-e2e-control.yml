name: Local attendance payroll E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-attendance-e2e-control.yml'
      - '.github/scripts/local-attendance-e2e.ps1'

jobs:
  run-local-attendance-payroll:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - name: Patch, verify and run feature on 5173
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'C:\alumdoor\.github\scripts\local-attendance-e2e.ps1'
          git -C C:\alumdoor fetch origin main --prune
          git -C C:\alumdoor show origin/main:.github/scripts/local-attendance-e2e.ps1 | Set-Content -Path C:\actions-runner\_temp\local-attendance-e2e.ps1 -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\actions-runner\_temp\local-attendance-e2e.ps1
