name: Temporary Query Local Item Groups

on:
  push:
    paths:
      - '.github/workflows/_tmp-query-item-groups.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: [self-hosted]
    timeout-minutes: 2
    steps:
      - name: Query local D1 Item Groups
        shell: cmd
        run: |
          @echo off
          cd /d C:\alumdoor\server || exit /b 1
          node node_modules\wrangler\bin\wrangler.js d1 execute cloudforge-demo --local --config apps\tenant-worker\wrangler.alumdoor-local.jsonc --command "SELECT name, disabled, json_extract(data_json,'$.parent_item_group') AS parent_item_group FROM master_records WHERE tenant_id='demo' AND record_type='Item Group' ORDER BY disabled, name;" || exit /b 1
