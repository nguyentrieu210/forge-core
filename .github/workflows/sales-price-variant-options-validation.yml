name: Sales Price Variant Options Validation

on:
  push:
    branches:
      - feat/sales-price-variant-options-20260811
  pull_request:
    branches:
      - feat/sales-pricing-authority-20260811

permissions:
  contents: read

concurrency:
  group: sales-price-variant-options-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build server
        working-directory: server
        run: pnpm run build
      - name: Variant and option regressions
        working-directory: server
        run: node --test tests/sales-price-variant.test.mjs tests/sales-option-resolver.test.mjs tests/commercial-pricing-policy.test.mjs tests/commercial-line-authority.test.mjs
      - name: Migration replay
        working-directory: server
        run: |
          python3 scripts/test-sales-pricing-authority-migration.py
          python3 scripts/test-sales-price-variant-options-migration.py
