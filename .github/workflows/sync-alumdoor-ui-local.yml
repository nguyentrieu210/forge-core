name: Sync AlumDoor Hardcode Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

# Triggered from ChatGPT to run the existing local sync runner.
concurrency:
  group: sync-alumdoor-hardcode-preview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Sync main to C:\alumdoor-hardcode-preview
        shell: cmd
        run: |
          @echo off
          set "TARGET=C:\alumdoor-hardcode-preview"
          set "REPO=https://github.com/nguyentrieu210/forge.git"

          if not exist "%TARGET%" mkdir "%TARGET%"
          if not exist "%TARGET%\.git" git -C "%TARGET%" init || exit /b 1

          git config --global --add safe.directory C:/alumdoor-hardcode-preview || exit /b 1

          git -C "%TARGET%" remote get-url origin >nul 2>&1
          if errorlevel 1 (
            git -C "%TARGET%" remote add origin "%REPO%" || exit /b 1
          ) else (
            git -C "%TARGET%" remote set-url origin "%REPO%" || exit /b 1
          )

          git -C "%TARGET%" fetch origin main --prune || exit /b 1
          git -C "%TARGET%" checkout -B main origin/main || exit /b 1
          git -C "%TARGET%" reset --hard origin/main || exit /b 1

          echo Synced hardcode preview to:
          git -C "%TARGET%" log -1 --oneline

      - name: Apply canonical Item Group seed to active local D1
        shell: powershell -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          $previewRoot = 'C:\alumdoor-hardcode-preview'
          $candidateRoots = @('C:\alumdoor', $previewRoot)
          $seedFile = Join-Path $previewRoot 'server\scripts\seed-alumdoor-item-groups-local.sql'
          if (-not (Test-Path $seedFile)) { throw "Seed file not found: $seedFile" }

          $wrangler = $null
          foreach ($root in $candidateRoots) {
            $candidate = Join-Path $root 'server\node_modules\wrangler\bin\wrangler.js'
            if (Test-Path $candidate) {
              $wrangler = $candidate
              break
            }
          }
          if (-not $wrangler) {
            throw 'Wrangler is not installed in C:\alumdoor or C:\alumdoor-hardcode-preview.'
          }

          $stateCandidates = @()
          foreach ($root in $candidateRoots) {
            foreach ($relativeState in @('server\apps\tenant-worker\.wrangler\state','server\.wrangler\state')) {
              $stateDir = Join-Path $root $relativeState
              if (Test-Path $stateDir) {
                $sqlite = Get-ChildItem -Path $stateDir -Recurse -File -Filter '*.sqlite' -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
                if ($sqlite) {
                  $stateCandidates += [pscustomobject]@{
                    Root = $root
                    Sqlite = $sqlite.FullName
                    LastWriteTime = $sqlite.LastWriteTime
                  }
                }
              }
            }
          }

          if ($stateCandidates.Count -gt 0) {
            $active = $stateCandidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            $activeRoot = $active.Root
            Write-Host "Using most recently active D1 state: $($active.Sqlite)"
          } elseif (Test-Path 'C:\alumdoor\server') {
            $activeRoot = 'C:\alumdoor'
            Write-Host 'No existing SQLite state found; defaulting to C:\alumdoor.'
          } else {
            $activeRoot = $previewRoot
            Write-Host 'No existing SQLite state found; defaulting to preview checkout.'
          }

          $serverRoot = Join-Path $activeRoot 'server'
          $config = Join-Path $serverRoot 'apps\tenant-worker\wrangler.alumdoor-local.jsonc'
          if (-not (Test-Path $config)) {
            $config = Join-Path $previewRoot 'server\apps\tenant-worker\wrangler.alumdoor-local.jsonc'
          }
          Set-Location $serverRoot

          # D1 rejects manual BEGIN/COMMIT statements. Keep the canonical seed source intact,
          # but strip only its outer transaction wrapper for Wrangler local execution.
          $d1Seed = Join-Path $env:TEMP 'alumdoor-item-groups-d1.sql'
          $seedText = Get-Content -Raw -LiteralPath $seedFile
          $seedText = $seedText -replace '(?m)^BEGIN TRANSACTION;\s*\r?\n', ''
          $seedText = $seedText -replace '(?m)^COMMIT;\s*\r?\n?', ''
          [System.IO.File]::WriteAllText($d1Seed, $seedText, [System.Text.UTF8Encoding]::new($false))

          Write-Host "Wrangler: $wrangler"
          Write-Host "D1 working root: $serverRoot"
          Write-Host "Config: $config"
          & node $wrangler d1 execute cloudforge-demo --local --config $config --file $d1Seed
          if ($LASTEXITCODE -ne 0) { throw "Item Group seed failed with exit code $LASTEXITCODE" }

          $verifySql = @"
          SELECT
            SUM(CASE WHEN disabled=0 THEN 1 ELSE 0 END) AS active_item_groups,
            SUM(CASE WHEN disabled=1 THEN 1 ELSE 0 END) AS disabled_item_groups
          FROM master_records
          WHERE tenant_id='demo' AND record_type='Item Group';
          "@
          & node $wrangler d1 execute cloudforge-demo --local --config $config --command $verifySql
          if ($LASTEXITCODE -ne 0) { throw "Item Group verification query failed with exit code $LASTEXITCODE" }

          $legacySql = @"
          SELECT name, disabled
          FROM master_records
          WHERE tenant_id='demo' AND record_type='Item Group'
            AND name IN ('Bộ lưu điện','Cửa cuốn','Cửa nhôm kính','Dịch vụ','Linh kiện & thiết bị','Mô tơ','Nguyên vật liệu','Phụ kiện','Remote và điều khiển','Thành phẩm','Cửa siêu trường')
          ORDER BY name;
          "@
          & node $wrangler d1 execute cloudforge-demo --local --config $config --command $legacySql
          if ($LASTEXITCODE -ne 0) { throw "Legacy Item Group verification query failed with exit code $LASTEXITCODE" }

          Write-Host 'Canonical Item Group seed applied to the active local D1.'
