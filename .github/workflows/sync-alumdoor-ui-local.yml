name: Sync AlumDoor Hardcode Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

# Triggered from ChatGPT to run the existing local sync runner.
concurrency:
  group: sync-alumdoor-hardcode-preview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted]
    timeout-minutes: 2
    steps:
      - name: Sync main to C:\alumdoor-hardcode-preview
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'C:\alumdoor-hardcode-preview'
          $repo = 'https://github.com/nguyentrieu210/forge.git'

          if (-not (Test-Path $path)) {
            New-Item -ItemType Directory -Path $path | Out-Null
          }

          if (-not (Test-Path (Join-Path $path '.git'))) {
            git -C $path init
          }

          $hasOrigin = git -C $path remote 2>$null | Where-Object { $_ -eq 'origin' }
          if ($hasOrigin) {
            git -C $path remote set-url origin $repo
          } else {
            git -C $path remote add origin $repo
          }

          git -C $path fetch origin main --prune
          git -C $path checkout -B main origin/main
          git -C $path reset --hard origin/main

          Write-Host "Synced hardcode preview to:"
          git -C $path log -1 --oneline
