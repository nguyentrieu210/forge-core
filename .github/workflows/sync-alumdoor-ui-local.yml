name: Sync AlumDoor Hardcode Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

# Triggered from ChatGPT to run the existing local sync runner.
concurrency:
  group: sync-alumdoor-hardcode-preview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted]
    timeout-minutes: 2
    steps:
      - name: Sync main to C:\alumdoor-hardcode-preview
        shell: cmd
        run: |
          @echo off
          set "TARGET=C:\alumdoor-hardcode-preview"
          set "REPO=https://github.com/nguyentrieu210/forge.git"

          if not exist "%TARGET%" mkdir "%TARGET%"
          if not exist "%TARGET%\.git" git -C "%TARGET%" init || exit /b 1

          git config --global --add safe.directory C:/alumdoor-hardcode-preview || exit /b 1

          git -C "%TARGET%" remote get-url origin >nul 2>&1
          if errorlevel 1 (
            git -C "%TARGET%" remote add origin "%REPO%" || exit /b 1
          ) else (
            git -C "%TARGET%" remote set-url origin "%REPO%" || exit /b 1
          )

          git -C "%TARGET%" fetch origin main --prune || exit /b 1
          git -C "%TARGET%" checkout -B main origin/main || exit /b 1
          git -C "%TARGET%" reset --hard origin/main || exit /b 1

          echo Synced hardcode preview to:
          git -C "%TARGET%" log -1 --oneline
