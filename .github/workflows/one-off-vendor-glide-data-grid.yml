name: One-off vendor Glide Data Grid

on:
  push:
    branches: [ui/vendor-glide-sales-grid]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/vendor-glide-sales-grid
          fetch-depth: 0

      - name: Clone upstream runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/glide-data-grid client/vendor/glide-data-grid
          git clone --depth 1 https://github.com/glideapps/glide-data-grid.git /tmp/glide-data-grid
          UPSTREAM_SHA="$(git -C /tmp/glide-data-grid rev-parse HEAD)"

          mkdir -p client/vendor/glide-data-grid/src
          cp /tmp/glide-data-grid/packages/core/LICENSE client/vendor/glide-data-grid/LICENSE
          cp /tmp/glide-data-grid/packages/core/package.json client/vendor/glide-data-grid/package.json
          cp /tmp/glide-data-grid/packages/core/README.md client/vendor/glide-data-grid/README.md
          cp /tmp/glide-data-grid/packages/core/API.md client/vendor/glide-data-grid/API.md

          rsync -a \
            --exclude='docs/' \
            --exclude='stories/' \
            --exclude='*.stories.tsx' \
            --exclude='*.stories.ts' \
            /tmp/glide-data-grid/packages/core/src/ \
            client/vendor/glide-data-grid/src/

          cat > client/vendor/glide-data-grid/UPSTREAM.md <<EOF
          # Upstream provenance

          Vendored from `glideapps/glide-data-grid`, package `@glideapps/glide-data-grid`.

          - Upstream repository: https://github.com/glideapps/glide-data-grid
          - Upstream commit: `${UPSTREAM_SHA}`
          - License: MIT (see `LICENSE`)
          - Source copied: `packages/core/src`
          - Excluded from vendor copy: Storybook/docs/test sources and `*.stories.*` files
          - Purpose in Forge: reusable Excel-like grid runtime for business-specific hardcoded editors such as AlumDoor Sales Order lines.

          Forge-specific adapters should live outside this vendor directory whenever possible so upstream source remains easy to diff/rebase.
          EOF

          echo "Vendored upstream ${UPSTREAM_SHA}"
          find client/vendor/glide-data-grid/src -type f | wc -l
          du -sh client/vendor/glide-data-grid

      - name: Commit vendored source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nguyentrieu210"
          git config user.email "trieu.nt93@gmail.com"
          rm .github/workflows/one-off-vendor-glide-data-grid.yml
          git add client/vendor/glide-data-grid .github/workflows/one-off-vendor-glide-data-grid.yml
          git commit -m "feat(ui): vendor Glide Data Grid runtime source"
          git push origin HEAD:ui/vendor-glide-sales-grid
