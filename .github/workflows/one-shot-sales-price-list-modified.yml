name: One-shot Sales Order price list client-side selection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sales-price-list-modified.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch file
        shell: bash
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          grep -F 'pageLength: 200' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          grep -F '.filter((row) => isOn(row.enabled) && isOn(row.selling))' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sales-price-list-modified.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "fix(ui): select latest active Sales price list client-side"
          git push origin HEAD:main
