name: Temporary Apply Alumdoor Measurement Geometry Local

on:
  push:
    paths:
      - '.github/workflows/_tmp-apply-measurement-geometry-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Sync forge main preview
        shell: cmd
        run: |
          @echo off
          set "TARGET=C:\alumdoor-hardcode-preview"
          git config --global --add safe.directory C:/alumdoor-hardcode-preview || exit /b 1
          git -C "%TARGET%" fetch origin main --prune || exit /b 1
          git -C "%TARGET%" checkout -B main origin/main || exit /b 1
          git -C "%TARGET%" reset --hard origin/main || exit /b 1
          for /f %%S in ('git -C "%TARGET%" rev-parse HEAD') do set "HEAD=%%S"
          echo Forge main=%HEAD%
          if /I not "%HEAD%"=="55eefc12f756d8d4ee8b13a04c2d5c38dfd48408" exit /b 1

      - name: Surgical D1 migration and canonical seed
        shell: cmd
        run: |
          @echo off
          node .github\scripts\_tmp-apply-measurement-geometry-local.mjs || exit /b 1

      - name: Sync local Alumdoor source authority
        shell: cmd
        run: |
          @echo off
          copy /Y C:\alumdoor-hardcode-preview\server\briefs\alumdoor-v2.json C:\alumdoor\server\briefs\alumdoor-v2.json >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\build-alumdoor-v2-brief.mjs C:\alumdoor\server\scripts\build-alumdoor-v2-brief.mjs >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\build-alumdoor-item-only-import.mjs C:\alumdoor\server\scripts\build-alumdoor-item-only-import.mjs >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\apply-alumdoor-measurement-geometry-overlay.mjs C:\alumdoor\server\scripts\apply-alumdoor-measurement-geometry-overlay.mjs >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\seed-alumdoor-measurement-geometry-local.mjs C:\alumdoor\server\scripts\seed-alumdoor-measurement-geometry-local.mjs >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\lib\alumdoor-measurement-profile-catalog.mjs C:\alumdoor\server\scripts\lib\alumdoor-measurement-profile-catalog.mjs >NUL || exit /b 1
          copy /Y C:\alumdoor-hardcode-preview\server\scripts\lib\alumdoor-geometry-catalog.mjs C:\alumdoor\server\scripts\lib\alumdoor-geometry-catalog.mjs >NUL || exit /b 1

      - name: Verify through Wrangler and smoke worker
        shell: cmd
        run: |
          @echo off
          cd /d C:\alumdoor\server || exit /b 1
          set "W=node node_modules\wrangler\bin\wrangler.js d1 execute cloudforge-demo --local --config apps\tenant-worker\wrangler.alumdoor-local.jsonc"
          %W% --command "SELECT app_id,version FROM installed_apps WHERE tenant_id='demo' AND app_id='alumdoor';" || exit /b 1
          %W% --command "SELECT doctype,count(*) AS n FROM documents WHERE tenant_id='demo' AND doctype IN ('Measurement Profile','Geometry Field','Geometry Profile') GROUP BY doctype ORDER BY doctype;" || exit /b 1
          %W% --command "SELECT name,json_extract(payload_json,'$.field_name') AS field_name FROM documents WHERE tenant_id='demo' AND doctype='Geometry Field' AND name IN ('PB_RAY_RONG','PB_NHUA_RONG') ORDER BY name;" || exit /b 1
          %W% --command "SELECT name,json_extract(payload_json,'$.stock_uom') AS stock_uom FROM documents WHERE tenant_id='demo' AND doctype='Measurement Profile' AND name IN ('Nhôm cây/lá','Thành phẩm theo m2') ORDER BY name;" || exit /b 1
          %W% --command "SELECT count(*) AS broken_geometry_field_links FROM documents p,json_each(json_extract(p.payload_json,'$.fields')) f WHERE p.tenant_id='demo' AND p.doctype='Geometry Profile' AND NOT EXISTS(SELECT 1 FROM documents gf WHERE gf.tenant_id=p.tenant_id AND gf.doctype='Geometry Field' AND gf.name=json_extract(f.value,'$.geometry_field'));" || exit /b 1
          curl.exe -sS --max-time 5 http://127.0.0.1:8799/api/method/ping >NUL || exit /b 1
          echo WORKER_8799_PASS
