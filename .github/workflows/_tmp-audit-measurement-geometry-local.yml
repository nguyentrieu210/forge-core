name: Temporary Audit Alumdoor Measurement Geometry Local

on:
  push:
    paths:
      - '.github/workflows/_tmp-audit-measurement-geometry-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Sync forge main preview
        shell: cmd
        run: |
          @echo off
          set "TARGET=C:\alumdoor-hardcode-preview"
          git config --global --add safe.directory C:/alumdoor-hardcode-preview || exit /b 1
          git -C "%TARGET%" fetch origin main --prune || exit /b 1
          git -C "%TARGET%" checkout -B main origin/main || exit /b 1
          git -C "%TARGET%" reset --hard origin/main || exit /b 1
          git -C "%TARGET%" rev-parse HEAD

      - name: Inspect active local D1 schema and current masters
        shell: cmd
        run: |
          @echo off
          cd /d C:\alumdoor\server || exit /b 1
          set "W=node node_modules\wrangler\bin\wrangler.js d1 execute cloudforge-demo --local --config apps\tenant-worker\wrangler.alumdoor-local.jsonc"
          %W% --command "PRAGMA table_info(doctype_definitions);" || exit /b 1
          %W% --command "PRAGMA table_info(installed_apps);" || exit /b 1
          %W% --command "PRAGMA table_info(app_owned_doctypes);" || exit /b 1
          %W% --command "SELECT app_id,version,length(manifest_json) AS manifest_bytes FROM installed_apps WHERE tenant_id='demo' AND app_id='alumdoor';" || exit /b 1
          %W% --command "SELECT doctype,count(*) AS n FROM documents WHERE tenant_id='demo' AND doctype IN ('Measurement Profile','Geometry Field','Geometry Profile') GROUP BY doctype ORDER BY doctype;" || exit /b 1
          %W% --command "SELECT name,payload_json FROM documents WHERE tenant_id='demo' AND doctype='Measurement Profile' ORDER BY name;" || exit /b 1
          %W% --command "SELECT doctype,length(definition_json) AS bytes FROM doctype_definitions WHERE tenant_id='demo' AND doctype IN ('Measurement Profile','Surface Finish','Surface Finish Scope') ORDER BY doctype;" || exit /b 1
          %W% --command "SELECT doctype FROM app_owned_doctypes WHERE tenant_id='demo' AND app_id='alumdoor' AND doctype IN ('Measurement Profile','Surface Finish','Surface Finish Scope') ORDER BY doctype;" || exit /b 1
