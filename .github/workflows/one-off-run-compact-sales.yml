name: Run compact Sales Order patch

on:
  push:
    branches: [ui/fix-sales-labels-density]
    paths:
      - .github/workflows/one-off-run-compact-sales.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ui/fix-sales-labels-density
      - name: Apply patch
        shell: powershell
        run: python .github/scripts/one_off_compact_sales.py
      - name: Commit patch and clean one-off files
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git rm .github/scripts/one_off_compact_sales.py
          git rm .github/workflows/one-off-run-compact-sales.yml
          git commit -m "fix(ui): compact ordinary Sales Order item layout"
          git push origin HEAD:ui/fix-sales-labels-density
