name: Local Self-Hosted Build and Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-local-main
  cancel-in-progress: true

jobs:
  build-run-local:
    name: Build and run Forge on local Windows runner
    runs-on: [self-hosted, windows, x64, forge-local]
    timeout-minutes: 60

    steps:
      - name: Stop previous local Forge before checkout
        shell: powershell
        run: |
          foreach ($port in @(8799, 5173)) {
            $owners = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique
            foreach ($ownerPid in $owners) {
              if ($ownerPid -and $ownerPid -ne $PID) {
                Write-Host "Stopping process tree PID=$ownerPid on port $port"
                taskkill.exe /PID $ownerPid /T /F | Out-Host
              }
            }
          }

      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Keep ignored local Wrangler/D1 state between runs. The workflow never
          # writes tracked source files, so a destructive git clean is unnecessary.
          clean: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend, migrate local D1, seed and start Desk
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\start-local-forge.ps1

      - name: Run Forge fast validation gate
        shell: powershell
        run: pnpm run validate:fast

      - name: Show local endpoints
        if: always()
        shell: powershell
        run: |
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $status = Join-Path $runnerRoot "_local\status.txt"
          if (Test-Path $status) {
            Get-Content $status
          } else {
            Write-Host "Local status file has not been created yet."
          }
