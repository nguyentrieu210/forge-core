name: Local Self-Hosted Build and Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-local-main
  cancel-in-progress: true

jobs:
  build-run-local:
    name: Run Forge on local Windows runner
    runs-on: [self-hosted, windows, x64, forge-local]
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: cmd
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Start Forge local
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start-local-forge.ps1

      - name: Show local endpoints
        shell: cmd
        run: type "%RUNNER_TEMP%\..\..\_local\status.txt"

      - name: Fast validation
        continue-on-error: true
        shell: cmd
        run: pnpm run validate:fast
