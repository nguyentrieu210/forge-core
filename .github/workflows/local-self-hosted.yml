name: Local Self-Hosted Build and Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-local-main
  cancel-in-progress: true

jobs:
  build-run-local:
    name: Build and run Forge on local Windows runner
    runs-on: [self-hosted, windows, x64, forge-local]
    timeout-minutes: 60

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Keep ignored local Wrangler/D1 state between runs. The local launcher
          # stops the old servers after checkout and before rebuilding.
          clean: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: cmd
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend, migrate local D1, seed and start Desk
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start-local-forge.ps1

      - name: Run Forge fast validation gate
        shell: cmd
        run: pnpm run validate:fast

      - name: Show local endpoints
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\..\..\_local\status.txt" (
            type "%RUNNER_TEMP%\..\..\_local\status.txt"
          ) else (
            echo Local status file has not been created yet.
          )
