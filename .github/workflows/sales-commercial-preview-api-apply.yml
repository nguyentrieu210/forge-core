name: Sales Commercial Preview API Apply

on:
  pull_request:
    branches:
      - exp/alumdoor-pricing-policy

permissions:
  contents: write

concurrency:
  group: sales-commercial-preview-api-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sales-commercial-complete-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical preview API
        working-directory: server
        run: node scripts/apply-sales-commercial-preview-api.mjs
      - name: Server build
        working-directory: server
        run: pnpm run build
      - name: Commercial tests
        working-directory: server
        run: node --test tests/commercial-line-resolver.test.mjs tests/commercial-line-price-variant.test.mjs tests/sales-option-resolver.test.mjs
      - name: Commit validated API patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No API patch changes"
            exit 0
          fi
          git config user.name "Forge Sales API Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/packages server/scripts
          git commit -m "feat(api): preview sales line with canonical resolver [skip ci]"
          git pull --rebase origin feat/sales-commercial-complete-20260811
          git push origin HEAD:feat/sales-commercial-complete-20260811
