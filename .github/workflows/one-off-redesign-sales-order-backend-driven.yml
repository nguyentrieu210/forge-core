name: One-off backend-driven Sales Order redesign

on:
  push:
    branches: [ui/redesign-sales-order-backend-driven]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/redesign-sales-order-backend-driven
          fetch-depth: 0
      - name: Patch Sales Order TSX only
        run: python .github/scripts/run-redesign-sales-order.py
      - name: Commit source-only result
        shell: bash
        run: |
          git rm .github/workflows/one-off-redesign-sales-order-backend-driven.yml
          git rm .github/scripts/run-redesign-sales-order.py
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git config user.name "forge-ui-bot"
          git config user.email "forge-ui-bot@users.noreply.github.com"
          git commit -m "refactor(ui): align Sales Order with commercial authorities"
          git push origin HEAD:ui/redesign-sales-order-backend-driven
