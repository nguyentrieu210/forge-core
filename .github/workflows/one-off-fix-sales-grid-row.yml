name: One-off fix Sales grid row

on:
  push:
    branches: [ui/fix-sales-grid-row]

permissions:
  contents: write

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ui/fix-sales-grid-row
      - shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx")
          s = path.read_text(encoding="utf-8")

          replacements = {
              "M???t h??ng": "M\u1eb7t h\u00e0ng",
              "??VT": "\u0110VT",
              "SL / Kh???i l?????ng": "SL / Kh\u1ed1i l\u01b0\u1ee3ng",
              "????n gi??": "\u0110\u01a1n gi\u00e1",
              "Ph??? thu": "Ph\u1ee5 thu",
              "Th??nh ti???n": "Th\u00e0nh ti\u1ec1n",
              "Nh??n d??ng": "Nh\u00e2n d\u00f2ng",
              "Xo?? d??ng": "Xo\u00e1 d\u00f2ng",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace('{money(line.rate)} ???', '{money(line.rate)} \u20ab')
          s = s.replace('`-${money(line.discount_amount)} ???` : "???"', '`-${money(line.discount_amount)} \u20ab` : "\u2014"')
          s = s.replace('`${money(line.adjustment_amount)} ???` : "???"', '`${money(line.adjustment_amount)} \u20ab` : "\u2014"')
          s = s.replace('{money(lineTotal(line))} ???', '{money(lineTotal(line))} \u20ab')

          old_grid = '                    <div className="grid items-end gap-1.5 md:grid-cols-2 xl:grid-cols-12">'
          new_grid = '                    <div className="grid items-end gap-1.5 md:grid-cols-2 xl:grid-cols-[42px_minmax(360px,2.5fr)_150px_150px_130px_130px_130px_130px_84px]">\n                      <div className="hidden xl:grid h-9 place-items-center text-xs font-semibold text-muted-foreground">{index + 1}</div>'
          if old_grid not in s:
              raise SystemExit("main grid marker missing")
          s = s.replace(old_grid, new_grid, 1)

          s = s.replace('className={text(line.item_code) ? "md:col-span-2 xl:col-span-4" : "md:col-span-2 xl:col-span-6"}', 'className="md:col-span-2 xl:col-span-1"', 1)
          s = s.replace('className="xl:col-span-2"', 'className="xl:col-span-1"', 1)
          # second UOM fallback occurrence
          s = s.replace('className="xl:col-span-2"', 'className="xl:col-span-1"', 1)
          # quantity occurrence
          s = s.replace('className="xl:col-span-2"', 'className="xl:col-span-1"', 1)

          blocks_match = re.search(
              r'\n            \{salesOptions\.length \? \(.*?\n            \) : null\}\n\n            \{colors\.length \? \(.*?\n            \) : null\}\n',
              s,
              flags=re.S,
          )
          if not blocks_match:
              raise SystemExit("sales option/color blocks missing")
          blocks = blocks_match.group(0)
          s = s[:blocks_match.start()] + "\n" + s[blocks_match.end():]

          detail_old = '          {text(line.item_code) && (showWidth || showHeight || showSets || showSalesMode || showLeafVariant || kind === "mesh" || fieldVisible(line, "has_butterfly_bracket") || showLength || showBars) ? (\n            <div className="grid items-end gap-1.5 border-t bg-muted/10 px-2 py-1.5 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-8">'
          detail_new = '          {text(line.item_code) && (salesOptions.length > 0 || colors.length > 0 || showWidth || showHeight || showSets || showSalesMode || showLeafVariant || kind === "mesh" || fieldVisible(line, "has_butterfly_bracket") || showLength || showBars) ? (\n            <div className="grid items-end gap-1.5 border-t bg-muted/10 px-2 py-1.5 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-8">' + blocks
          if detail_old not in s:
              raise SystemExit("detail marker missing")
          s = s.replace(detail_old, detail_new, 1)

          s = s.replace('className="flex flex-wrap items-center justify-end gap-x-2 gap-y-1 border-t px-2 py-1 text-[10px] tabular-nums"', 'className="flex flex-wrap items-center justify-end gap-x-2 gap-y-1 border-t px-2 py-1 text-[10px] tabular-nums xl:hidden"', 1)

          path.write_text(s, encoding="utf-8", newline="\n")
          '@ | python -

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git rm .github/workflows/one-off-fix-sales-grid-row.yml
          git commit -m "fix(ui): align Sales Order hardcoded grid row"
          git push origin HEAD:ui/fix-sales-grid-row
