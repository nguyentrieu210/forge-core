name: Sales Pricing Authority Validation

on:
  push:
    branches:
      - feat/sales-pricing-authority-20260811
  pull_request:
    branches:
      - docs/sales-commercial-architecture-20260811
    paths:
      - "server/packages/clouderp-pricing/**"
      - "server/packages/clouderp-selling/**"
      - "server/tests/commercial-*.test.mjs"
      - ".github/workflows/sales-pricing-authority-validation.yml"

permissions:
  contents: read

concurrency:
  group: sales-pricing-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        working-directory: server
        run: pnpm run build

      - name: Commercial pricing regressions
        working-directory: server
        run: node --test tests/commercial-pricing-policy.test.mjs tests/commercial-line-authority.test.mjs tests/sales-uom-pricing.test.mjs tests/sales-price-field-lookup.test.mjs
