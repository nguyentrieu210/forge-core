name: One-shot Sales Order Price List orderBy fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sales-price-list-orderby.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Patch Price List request
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx')
          s = p.read_text(encoding='utf-8')
          marker = 'const priceLists = await adapter.getList("Price List", {'
          start = s.index(marker)
          end = s.index('});', start)
          block = s[start:end]
          if 'orderBy:' not in block:
              pos = s.index('pageLength: 200,', start, end)
              line_start = s.rfind('\n', start, pos) + 1
              indent = s[line_start:pos]
              s = s[:line_start] + indent + 'orderBy: "modified desc",\n' + s[line_start:]
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -A4 -F 'adapter.getList("Price List"' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx | grep -F 'orderBy: "modified desc"'
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-sales-price-list-orderby.yml
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git commit -m "fix(ui): send non-empty Price List order_by"
          git push origin HEAD:main
