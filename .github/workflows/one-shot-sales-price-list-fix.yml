name: One-shot Sales Order price-list fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-shot-sales-price-list-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Sales Order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx')
          s=p.read_text(encoding='utf-8')
          a='''        const [itemMeta, boot, caps] = await Promise.all([\n          adapter.getMeta(childDoctype),\n          adapter.getBoot(),\n          adapter.getCapabilities("Sales Order"),\n        ]);'''
          b='''        const [itemMeta, boot, caps, sellingPriceLists] = await Promise.all([\n          adapter.getMeta(childDoctype),\n          adapter.getBoot(),\n          adapter.getCapabilities("Sales Order"),\n          adapter.getList("Price List", {\n            fields: ["name", "price_list_name", "creation"],\n            filters: { enabled: 1, selling: 1 },\n            orderBy: "creation desc",\n            pageLength: 1,\n          }).catch(() => []),\n        ]);'''
          c='''        if (!defaults.transaction_date) defaults.transaction_date = today();\n        if (!defaults.delivery_date) defaults.delivery_date = today();\n        if (!defaults.currency) defaults.currency = boot.sysdefaults.currency || "VND";'''
          d='''        if (!defaults.transaction_date) defaults.transaction_date = today();\n        if (!defaults.delivery_date) defaults.delivery_date = today();\n        if (!defaults.currency) defaults.currency = boot.sysdefaults.currency || "VND";\n        const latestSellingPriceList = text(sellingPriceLists[0]?.name)\n          || text(sellingPriceLists[0]?.price_list_name);\n        if (latestSellingPriceList) defaults.selling_price_list = latestSellingPriceList;'''
          replacements=[
            (a,b,'price-list query'),
            (c,d,'price-list default'),
            ('headerField("selling_price_list", "B\\u1ea3ng gi\\u00e1", "Link", "Price List")','headerField("selling_price_list", "Bảng giá", "Link", "Price List")','field label'),
            ('label="B\\u1ea3ng gi\\u00e1"','label="Bảng giá"','visible label'),
          ]
          for old,new,name in replacements:
            n=s.count(old)
            if n != 1: raise SystemExit(f'{name}: expected 1 match, found {n}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/one-shot-sales-price-list-fix.yml
          git diff --check
          grep -F 'label="Bảng giá"' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          grep -F 'filters: { enabled: 1, selling: 1 }' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          grep -F 'orderBy: "creation desc"' client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
      - name: Commit to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx .github/workflows/one-shot-sales-price-list-fix.yml
          git commit -m 'fix(ui): default Sales Order to latest active price list'
          git push origin HEAD:main
