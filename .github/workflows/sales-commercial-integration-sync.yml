name: Sales Commercial Integration Sync

on:
  push:
    branches:
      - feat/sales-commercial-complete-20260811
  pull_request:
    branches:
      - exp/alumdoor-pricing-policy

permissions:
  contents: write

jobs:
  sync-latest-alumdoor-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/sales-commercial-complete-20260811
      - name: Overlay latest settled AlumDoor UI/brief files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin exp/alumdoor-pricing-policy
          git checkout origin/exp/alumdoor-pricing-policy -- \
            client/packages/views/src/form/FormView.tsx \
            client/packages/views/src/form/layout.ts \
            server/apps-src/alumdoor-worker/src/index.ts \
            server/apps-src/alumdoor-worker/src/ui-document-preview.ts \
            server/briefs/alumdoor-v2.json \
            server/scripts/build-alumdoor-v2-brief.mjs \
            server/scripts/lib/brief-ui-view-policy.mjs \
            server/scripts/verify-alumdoor-mua.mjs \
            server/scripts/verify-alumdoor.mjs
          if git diff --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "Forge Sales Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "chore(sales): sync latest AlumDoor UI baseline [skip ci]"
          git push origin HEAD:feat/sales-commercial-complete-20260811
