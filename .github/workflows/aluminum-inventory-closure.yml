name: Alumdoor Aluminum Inventory Closure

on:
  pull_request:
    branches: [main]
    paths:
      - "server/packages/clouderp-core/src/uom.ts"
      - "server/packages/clouderp-stock/**"
      - "server/packages/clouderp-erpnext/**"
      - "server/apps-src/alumdoor-worker/**"
      - "server/tests/aluminum-*.test.mjs"
      - "server/tests/alumdoor-item-validator.test.mjs"
      - "server/tests/alumdoor-v2-inventory.test.mjs"
      - "server/tests/purchase-*.test.mjs"
      - "server/tests/catch-weight-valuation.test.mjs"
      - "server/tests/stock-reservation-integrity.test.mjs"
      - "server/tests/manufacturing-*.test.mjs"
      - "server/scripts/alumdoor-aluminum-inventory-cutover-plan.mjs"
      - "docs/agents/alumdoor/ALUMINUM_INVENTORY_CLOSURE_20260811.md"
      - ".github/workflows/aluminum-inventory-closure.yml"

permissions:
  contents: read

concurrency:
  group: aluminum-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'feat/alumdoor-aluminum-inventory-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit exact-head server dist
        working-directory: server
        shell: bash
        run: |
          set +e
          pnpm exec tsc -p tsconfig.json --noEmitOnError false --pretty false 2>&1 | tee /tmp/aluminum-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          test -f dist/packages/clouderp-core/src/uom.js
          test -f dist/apps-src/alumdoor-worker/src/aluminum-purchase-closure.js
          test -f dist/apps-src/alumdoor-worker/src/aluminum-supply-demand.js
          test -f dist/apps-src/alumdoor-worker/src/aluminum-validation-bridge.js
          if [ "$status" -ne 0 ]; then
            echo "Repository TypeScript baseline is non-zero. Failing only if changed aluminum files have TS errors."
            grep "error TS" /tmp/aluminum-tsc.log > /tmp/aluminum-ts-errors.log || true
            cat /tmp/aluminum-ts-errors.log
            if grep -E 'packages/clouderp-core/src/uom\.ts|apps-src/alumdoor-worker/src/(entry|item-catalog-invariants|aluminum-purchase-closure|aluminum-supply-demand|aluminum-validation-bridge)\.ts' /tmp/aluminum-ts-errors.log; then
              echo "Changed aluminum closure source has TypeScript errors"
              exit 1
            fi
          fi

      - name: Dual-measure purchase and tracked receipt
        working-directory: server
        run: |
          node --test \
            tests/aluminum-exact-purchase-uom.test.mjs \
            tests/aluminum-purchase-closure.test.mjs \
            tests/aluminum-purchase-batch-ledger.test.mjs \
            tests/purchase-receipt-allocation-controller.test.mjs \
            tests/r5-03-purchase-allocation-measure.test.mjs \
            tests/catch-weight-valuation.test.mjs

      - name: Validator and mixed-document boundary
        working-directory: server
        run: |
          node --test \
            tests/alumdoor-item-validator.test.mjs \
            tests/aluminum-item-validator-boundary.test.mjs \
            tests/aluminum-validation-bridge.test.mjs

      - name: Aluminum ATP reservation and cut closure
        working-directory: server
        run: |
          node --test \
            tests/aluminum-supply-demand.test.mjs \
            tests/aluminum-entry-authority.test.mjs \
            tests/alumdoor-v2-inventory.test.mjs \
            tests/stock-reservation-integrity.test.mjs

      - name: Manufacturing compatibility
        working-directory: server
        shell: bash
        run: |
          tests=(
            tests/manufacturing-mrp.test.mjs
            tests/manufacturing-bom-bulk.test.mjs
            tests/alumdoor-manufacturing-lifecycle.test.mjs
          )
          existing=()
          for file in "${tests[@]}"; do
            if [ -f "$file" ]; then existing+=("$file"); fi
          done
          if [ "${#existing[@]}" -gt 0 ]; then node --test "${existing[@]}"; fi

      - name: Legacy authority and cutover safety
        working-directory: server
        run: |
          if grep -nE 'syncLotsFromReceipt|Aluminium%20Lot' apps-src/alumdoor-worker/src/entry.ts; then
            echo "Deployed entrypoint still references legacy aluminum balance authority"
            exit 1
          fi
          grep -q 'skipped_legacy_aluminium_lot_sync' apps-src/alumdoor-worker/src/entry.ts
          grep -q 'production_mutation_authorized: false' scripts/alumdoor-aluminum-inventory-cutover-plan.mjs

      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
