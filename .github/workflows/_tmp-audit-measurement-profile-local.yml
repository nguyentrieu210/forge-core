name: Temporary Audit Measurement Profile Local

on:
  push:
    branches: [tmp/audit-measurement-profile-local]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit local D1 and current V2 schema
        shell: powershell -NoProfile -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import { DatabaseSync } from 'node:sqlite';

          const dir = String.raw`C:\alumdoor\server\apps\tenant-worker\.wrangler\state\v3\d1\miniflare-D1DatabaseObject`;
          const dbs = fs.readdirSync(dir)
            .filter((name) => name.endsWith('.sqlite'))
            .map((name) => path.join(dir, name))
            .sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);
          if (!dbs.length) throw new Error('NO_D1_SQLITE');
          const dbPath = dbs[0];
          const db = new DatabaseSync(dbPath, { readOnly: true });
          console.log('D1_SQLITE', dbPath);

          const profileRows = db.prepare(`
            SELECT name, payload_json FROM documents
            WHERE tenant_id='demo' AND doctype='Measurement Profile'
            ORDER BY name
          `).all();
          console.log('MEASUREMENT_PROFILE_COUNT', profileRows.length);
          const keys = ['profile_name','inventory_mode','stock_uom','track_dimension_lot','require_color','require_condition','require_length','require_width','require_piece_qty','track_bundle_qty','weight_tolerance_pct','theoretical_kg_per_m','effective_width_m','scrap_threshold_m','kerf_mm','disabled','_migration_source'];
          for (const row of profileRows) {
            const p = JSON.parse(row.payload_json || '{}');
            const out = Object.fromEntries(keys.filter((k) => Object.hasOwn(p, k)).map((k) => [k, p[k]]));
            console.log('PROFILE', row.name, JSON.stringify(out));
          }

          const itemRows = db.prepare(`
            SELECT name, payload_json FROM documents
            WHERE tenant_id='demo' AND doctype='Item'
            ORDER BY name
          `).all();
          console.log('ITEM_COUNT', itemRows.length);
          const combos = new Map();
          for (const row of itemRows) {
            const p = JSON.parse(row.payload_json || '{}');
            const obj = {
              measurement_profile: p.measurement_profile ?? null,
              inventory_mode: p.inventory_mode ?? null,
              stock_uom: p.stock_uom ?? null,
              default_purchase_uom: p.default_purchase_uom ?? null,
            };
            const key = JSON.stringify(obj);
            combos.set(key, (combos.get(key) ?? 0) + 1);
          }
          for (const [key, count] of [...combos].sort(([a],[b]) => a.localeCompare(b))) {
            console.log('ITEM_COMBO', count, key);
          }

          const app = db.prepare(`
            SELECT installed_version, revision, content_hash FROM installed_apps
            WHERE tenant_id='demo' AND app_id='alumdoor'
          `).get();
          console.log('INSTALLED_APP', JSON.stringify(app ?? null));

          const briefPath = String.raw`C:\alumdoor-hardcode-preview\server\briefs\alumdoor-v2.json`;
          const brief = JSON.parse(fs.readFileSync(briefPath, 'utf8'));
          const dt = brief.doctypes.find((x) => x.name === 'Measurement Profile');
          console.log('V2_VERSION', brief.version);
          console.log('V2_MP_LABEL', dt?.label);
          for (const raw of dt?.fields ?? []) console.log('V2_FIELD', typeof raw === 'string' ? raw : JSON.stringify(raw));
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\audit_measurement_profile.mjs"
          node "$env:RUNNER_TEMP\audit_measurement_profile.mjs"
