name: UI REC 01 Exact Branch Validation 2026-08-11

on:
  push:
    branches:
      - agent/ui-rec-01-backend-meta-20260811

permissions:
  contents: write

concurrency:
  group: ui-rec-01-validation-20260811
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and persist exact-head evidence
        shell: bash
        run: |
          set +e
          {
            echo '$ node --check server/scripts/audit-backend-ui-surfaces.mjs'
            node --check server/scripts/audit-backend-ui-surfaces.mjs
            echo
            echo '$ node --test server/tests/backend-ui-reconciliation.test.mjs'
            node --test server/tests/backend-ui-reconciliation.test.mjs
            echo
            echo '$ validate committed matrix JSON'
            node -e "JSON.parse(require('node:fs').readFileSync('docs/agents/backend-ui-reconciliation/BACKEND_UI_SURFACE_MATRIX.json','utf8')); console.log('BACKEND_UI_SURFACE_MATRIX_JSON_PASS')"
            echo
            echo '$ git diff --check'
            git diff --check
            test -s docs/agents/backend-ui-reconciliation/BACKEND_UI_SURFACE_MATRIX_SUMMARY.md
          } > /tmp/ui-rec-01-validation.log 2>&1
          rc=$?
          set -e

          result=PASS
          if [ "$rc" -ne 0 ]; then result=FAIL; fi
          mkdir -p docs/agents/backend-ui-reconciliation
          {
            echo '# UI-REC-01 — EXACT-HEAD CI EVIDENCE'
            echo
            echo "Validated head: \`${GITHUB_SHA}\`"
            echo "Runner: \`${RUNNER_OS}\` / Node 24"
            echo "Result: **${result}**"
            echo
            echo '```text'
            cat /tmp/ui-rec-01-validation.log
            echo '```'
          } > docs/agents/backend-ui-reconciliation/UI-REC-01-CI-EVIDENCE.md

          git config user.name 'Forge UI-REC Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/agents/backend-ui-reconciliation/UI-REC-01-CI-EVIDENCE.md
          git commit -m "ci(ui-rec-01): record exact-head validation ${result} [skip ci]" || true
          git push origin HEAD:agent/ui-rec-01-backend-meta-20260811
          exit "$rc"
