name: Forge Sales Convergence 2026-08-11

on:
  pull_request:
    branches:
      - converge/forge-20260811
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: forge-sales-convergence-20260811
  cancel-in-progress: false

jobs:
  converge:
    if: github.event.pull_request.number == 819 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/forge-20260811
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Merge canonical Sales head with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Forge Convergence Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin feat/sales-commercial-complete-20260811 feature/attendance-payroll feat/alumdoor-aluminum-inventory-closure
          set +e
          git merge --no-ff --no-commit origin/feat/sales-commercial-complete-20260811
          merge_rc=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort || true)"
          printf 'Conflicts:\n%s\n' "$conflicts"
          expected="$(printf '%s\n' \
            server/apps-src/alumdoor-worker/src/index.ts \
            server/briefs/alumdoor-v2.json \
            server/packages/clouderp-erpnext/src/registry.ts \
            server/packages/frappe-api/src/router.ts \
            server/scripts/build-alumdoor-v2-brief.mjs | sort)"
          if [ "$merge_rc" -ne 0 ] && [ "$conflicts" != "$expected" ]; then
            echo "Unexpected conflict set; refusing automatic convergence."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$conflicts") || true
            exit 1
          fi
          if [ -n "$conflicts" ]; then
            git checkout --theirs -- \
              server/apps-src/alumdoor-worker/src/index.ts \
              server/packages/clouderp-erpnext/src/registry.ts \
              server/packages/frappe-api/src/router.ts \
              server/scripts/build-alumdoor-v2-brief.mjs
            git checkout --ours -- server/briefs/alumdoor-v2.json
            git add \
              server/apps-src/alumdoor-worker/src/index.ts \
              server/packages/clouderp-erpnext/src/registry.ts \
              server/packages/frappe-api/src/router.ts \
              server/scripts/build-alumdoor-v2-brief.mjs \
              server/briefs/alumdoor-v2.json
          fi
      - name: Reapply Attendance and Inventory authority on shared Sales files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AlumDoor Worker: Sales version is authoritative for Sales/cut behavior;
          # re-add Attendance/Payroll routes from the already-converged HCM lane.
          path = 'server/apps-src/alumdoor-worker/src/index.ts'
          old = 'import { attendanceChallenge, attendanceScan } from "./attendance-routes.js";\n'
          new = old + '''import {\n  attendanceExceptions, attendanceMonth, attendanceReviewCorrection,\n  attendanceSubmitCorrection, attendanceToday,\n} from "./attendance-operational-routes.js";\nimport {\n  payrollApprovePeriod, payrollCalculatePeriod, payrollCreatePeriod, payrollMarkPaid,\n  payrollMySlips, payrollPeriodList, payrollPeriodSlips, payrollSubmitPeriod,\n} from "./payroll-routes.js";\n'''
          replace_once(path, old, new, 'worker attendance imports')
          old = '        if (method === "alumdoor.attendance.scan") return await attendanceScan({ request, call, env, args });\n'
          new = old + '''        if (method === "alumdoor.attendance.today") return await attendanceToday({ call, args });\n        if (method === "alumdoor.attendance.month") return await attendanceMonth({ call, args });\n        if (method === "alumdoor.attendance.exceptions") return await attendanceExceptions({ call, args });\n        if (method === "alumdoor.attendance.submit_correction") return await attendanceSubmitCorrection({ call, args });\n        if (method === "alumdoor.attendance.review_correction") return await attendanceReviewCorrection({ call, args });\n        if (method === "alumdoor.payroll.period_list") return await payrollPeriodList({ call, args });\n        if (method === "alumdoor.payroll.create_period") return await payrollCreatePeriod({ call, args });\n        if (method === "alumdoor.payroll.calculate_period") return await payrollCalculatePeriod({ call, args });\n        if (method === "alumdoor.payroll.submit_period") return await payrollSubmitPeriod({ call, args });\n        if (method === "alumdoor.payroll.approve_period") return await payrollApprovePeriod({ call, args });\n        if (method === "alumdoor.payroll.mark_paid") return await payrollMarkPaid({ call, args });\n        if (method === "alumdoor.payroll.period_slips") return await payrollPeriodSlips({ call, args });\n        if (method === "alumdoor.payroll.my_slips") return await payrollMySlips({ call, args, actorUser: platformActorUser(request) });\n'''
          replace_once(path, old, new, 'worker attendance routes')

          # ERP registry: preserve Sales stock/reservation controllers and add payroll authority.
          path = 'server/packages/clouderp-erpnext/src/registry.ts'
          p = Path(path); text = p.read_text(encoding='utf-8')
          text = text.replace('EInvoiceSubmissionController, PayrollEntryController,\n  SubscriptionController', 'EInvoiceSubmissionController,\n  SubscriptionController')
          anchor = 'import { AlumDoorAttendanceDayController } from "./alumdoor-attendance.js";\n'
          addition = anchor + 'import { AlumDoorPayProfileController } from "./alumdoor-payroll.js";\nimport { AlumDoorAwarePayrollEntryController } from "./alumdoor-payroll-entry.js";\n'
          if 'AlumDoorAwarePayrollEntryController' not in text:
              if anchor not in text: raise SystemExit('registry attendance import anchor not found')
              text = text.replace(anchor, addition, 1)
          text = text.replace('.register(new PayrollEntryController())', '.register(new AlumDoorAwarePayrollEntryController())')
          anchor2 = '    .register(new AlumDoorAttendanceDayController())\n'
          if '    .register(new AlumDoorPayProfileController())\n' not in text:
              if anchor2 not in text: raise SystemExit('registry attendance registration anchor not found')
              text = text.replace(anchor2, '    .register(new AlumDoorPayProfileController())\n' + anchor2, 1)
          p.write_text(text, encoding='utf-8')

          # Frappe router: Sales preview is kept; add Attendance correction/payroll callbacks.
          path = 'server/packages/frappe-api/src/router.ts'
          p = Path(path); text = p.read_text(encoding='utf-8')
          iface_anchor = '''  commitAlumdoorAttendanceScan?: (input: {\n    station: string;\n    nonceHash: string;\n    deviceFingerprintHash?: string;\n  }) => Promise<JsonObject>;\n'''
          iface_add = iface_anchor + '''  submitAlumdoorAttendanceCorrection?: (input: {\n    workDate: string; segmentCode: string; requestedIn?: string; requestedOut?: string;\n    reason: string; attachment?: string;\n  }) => Promise<JsonObject>;\n  reviewAlumdoorAttendanceCorrection?: (input: {\n    request: string; action: "approve" | "reject"; note?: string;\n  }) => Promise<JsonObject>;\n  approveAlumdoorPayroll?: (input: { payrollEntry: string }) => Promise<JsonObject>;\n'''
          if 'submitAlumdoorAttendanceCorrection?:' not in text:
              if iface_anchor not in text: raise SystemExit('router interface anchor not found')
              text = text.replace(iface_anchor, iface_add, 1)
          dispatch_anchor = '''    case "metaforge.api.commit_alumdoor_attendance_scan":\n      return methodResponse(await commitAlumdoorAttendanceScan(args, context));\n'''
          dispatch_add = dispatch_anchor + '''\n    case "metaforge.api.submit_alumdoor_attendance_correction":\n      return methodResponse(await submitAlumdoorAttendanceCorrection(args, context));\n\n    case "metaforge.api.review_alumdoor_attendance_correction":\n      return methodResponse(await reviewAlumdoorAttendanceCorrection(args, context));\n\n    case "metaforge.api.approve_alumdoor_payroll":\n      return methodResponse(await approveAlumdoorPayroll(args, context));\n'''
          if 'case "metaforge.api.submit_alumdoor_attendance_correction"' not in text:
              if dispatch_anchor not in text: raise SystemExit('router dispatch anchor not found')
              text = text.replace(dispatch_anchor, dispatch_add, 1)
          fn_anchor = 'async function alumdoorAttendanceQrConfig(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {\n'
          fn_add = '''async function submitAlumdoorAttendanceCorrection(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {\n  if (context.appCallbackAppId !== "alumdoor" || !context.submitAlumdoorAttendanceCorrection) {\n    throw errors.permission("AlumDoor attendance correction accepts only the verified AlumDoor app callback.");\n  }\n  const requestedIn = args.text("requested_in");\n  const requestedOut = args.text("requested_out");\n  const attachment = args.text("attachment");\n  return context.submitAlumdoorAttendanceCorrection({\n    workDate: args.requireText("work_date", 10),\n    segmentCode: args.requireText("segment_code", 16),\n    ...(requestedIn ? { requestedIn } : {}),\n    ...(requestedOut ? { requestedOut } : {}),\n    reason: args.requireText("reason", 1000),\n    ...(attachment ? { attachment } : {}),\n  });\n}\n\nasync function reviewAlumdoorAttendanceCorrection(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {\n  if (context.appCallbackAppId !== "alumdoor" || !context.reviewAlumdoorAttendanceCorrection) {\n    throw errors.permission("AlumDoor attendance correction review accepts only the verified AlumDoor app callback.");\n  }\n  const action = args.requireText("action", 16);\n  if (action !== "approve" && action !== "reject") throw errors.validation("action must be approve or reject");\n  const note = args.text("note");\n  return context.reviewAlumdoorAttendanceCorrection({\n    request: args.requireText("request", 320),\n    action,\n    ...(note ? { note } : {}),\n  });\n}\n\nasync function approveAlumdoorPayroll(args: FrappeArgs, context: FrappeRouterContext): Promise<JsonObject> {\n  if (context.appCallbackAppId !== "alumdoor" || !context.approveAlumdoorPayroll) {\n    throw errors.permission("AlumDoor payroll approval accepts only the verified AlumDoor app callback.");\n  }\n  return context.approveAlumdoorPayroll({ payrollEntry: args.requireText("payroll_entry", 320) });\n}\n\n'''
          if 'async function submitAlumdoorAttendanceCorrection(' not in text:
              if fn_anchor not in text: raise SystemExit('router function anchor not found')
              text = text.replace(fn_anchor, fn_add + fn_anchor, 1)
          p.write_text(text, encoding='utf-8')

          # Sales builder is the newest UI metadata source; reapply the Inventory canonical
          # counted-stock/catch-weight contract before regenerating alumdoor-v2.json.
          path = 'server/scripts/build-alumdoor-v2-brief.mjs'
          p = Path(path); text = p.read_text(encoding='utf-8')
          old_g1 = '''// ── G1. Chủ xưởng chốt lại ngày 30/07: nhôm nhập và tồn theo KG ──\n// Số cây/lá, số bó và chiều dài là quy cách vật lý để tính barem và theo dõi nhà máy giao;\n// không thay thế số lượng giao dịch. `qty` của đơn mua là kg barem, `qty` của phiếu nhập là\n// số lượng thực nhận theo ĐVT mua. Vì vậy profile nhôm phải giữ stock_uom = Kg.\nfixture("Measurement Profile", "Nhôm cây/lá").data.stock_uom = "Kg";\nnote('G1 · Measurement Profile "Nhôm cây/lá": nhập/tồn Kg; cây/lá là số lượng phụ');\n'''
          new_g1 = '''// ── G1. Contract canonical 11/08: nhôm mua/định giá theo Kg, tồn vật lý theo Cây/Lá ──\n// Kg là catch weight và priced quantity; số cây/lá là stock quantity. Hai trục cùng nằm trên\n// Stock Ledger/Batch, tuyệt đối không dùng hệ số Kg↔Cây tĩnh và không tạo shadow balance.\nfixture("Measurement Profile", "Nhôm cây/lá").data.stock_uom = "Cây";\nnote('G1 · Measurement Profile "Nhôm cây/lá": tồn Cây/Lá; Kg là catch weight và đơn vị mua/định giá');\n'''
          if 'Contract canonical 11/08' not in text:
              if old_g1 not in text: raise SystemExit('builder G1 anchor not found')
              text = text.replace(old_g1, new_g1, 1)
          child_anchor = 'const childPresentation = applyAlumdoorChildPresentation(brief);\n'
          inv_block = '''// ── ALUMINUM INVENTORY AUTHORITY CONVERGENCE ──\n// Effective package must be born canonical: purchase/price in Kg, physical stock in Cây/Lá,\n// Batch identity + catch weight, and qty_bar as exact purchase stock/allocation quantity.\nconst technicalItemFields = [\n  { fieldname: "purchase_stock_qty_field", fieldtype: "Data", label: "Trường SL tồn mua", hidden: true, read_only: true },\n  { fieldname: "purchase_allocation_qty_field", fieldtype: "Data", label: "Trường SL phân bổ mua", hidden: true, read_only: true },\n  { fieldname: "purchase_allocation_uom", fieldtype: "Link", options: "UOM", label: "ĐVT phân bổ mua", hidden: true, read_only: true },\n];\nfor (const field of technicalItemFields) {\n  if (!item.fields.some((existing) => typeof existing === "object" && existing?.fieldname === field.fieldname)) item.fields.push(field);\n}\nconst canonicalAluminumProfile = fixture("Measurement Profile", "Nhôm cây/lá").data;\ncanonicalAluminumProfile.stock_uom = "Cây";\ncanonicalAluminumProfile.track_dimension_lot = true;\ncanonicalAluminumProfile.require_piece_qty = true;\ncanonicalAluminumProfile._desc = "Tồn nhôm theo số cây/lá có Batch và chiều dài; Kg là catch weight/đơn vị mua-định giá, không phải số lượng tồn.";\nfor (const f of brief.fixtures) {\n  if (f?.type !== "Item" || f?.data?.inventory_mode !== "Nhôm cây/lá") continue;\n  f.data.stock_uom = "Cây";\n  f.data.default_purchase_uom = "Kg";\n  f.data.has_batch_no = 1;\n  f.data.has_catch_weight = 1;\n  f.data.weight_uom = "Kg";\n  f.data.purchase_stock_qty_field = "qty_bar";\n  f.data.purchase_allocation_qty_field = "qty_bar";\n  f.data.purchase_allocation_uom = "Cây";\n  f.data.allow_negative_stock = 0;\n  f.data.uom_conversions = [];\n}\nnote('AL-INV · package canonical: Kg priced/catch-weight + Cây/Lá stock + Batch + qty_bar descriptors');\n\n'''
          if 'ALUMINUM INVENTORY AUTHORITY CONVERGENCE' not in text:
              if child_anchor not in text: raise SystemExit('builder child-presentation anchor not found')
              text = text.replace(child_anchor, inv_block + child_anchor, 1)
          text = text.replace('writeFileSync(OUT, JSON.stringify(brief, null, 1) + "\\n", "utf8");', 'writeFileSync(OUT, JSON.stringify(brief, null, 2) + "\\n", "utf8");')
          p.write_text(text, encoding='utf-8')
          PY
          node server/scripts/build-alumdoor-v2-brief.mjs
          git add \
            server/apps-src/alumdoor-worker/src/index.ts \
            server/packages/clouderp-erpnext/src/registry.ts \
            server/packages/frappe-api/src/router.ts \
            server/scripts/build-alumdoor-v2-brief.mjs \
            server/briefs/alumdoor-v2.json
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"; git diff --name-only --diff-filter=U; exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Combined server build and critical regressions
        working-directory: server
        run: |
          pnpm run build
          node --test \
            tests/aluminum-purchase-closure.test.mjs \
            tests/aluminum-supply-demand.test.mjs \
            tests/alumdoor-payroll-integration.test.mjs \
            tests/alumdoor-payroll-coordinator.test.mjs \
            tests/commercial-line-authority.test.mjs \
            tests/sales-option-resolver.test.mjs \
            tests/outbound-reservation-guard.test.mjs \
            tests/o2c.test.mjs
      - name: Commit and push combined Sales convergence
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m "converge: sales commercial with inventory and payroll authorities"
          git push origin HEAD:converge/forge-20260811
