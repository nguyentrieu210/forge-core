name: Alumdoor Source Converge Once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/aluminum-source-converge-once.yml"

permissions:
  contents: write

jobs:
  converge:
    if: github.head_ref == 'feat/alumdoor-aluminum-inventory-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Patch stale generated-contract assertions only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/tests/alumdoor-item-model.test.mjs')
          s = p.read_text()
          old = '''v2Brief.fixtures.find((entry) => entry.type === "Measurement Profile" && entry.name === "Nhôm cây/lá")?.data?.stock_uom,\n    "Kg",'''
          new = '''v2Brief.fixtures.find((entry) => entry.type === "Measurement Profile" && entry.name === "Nhôm cây/lá")?.data?.stock_uom,\n    "Cây",'''
          if old not in s:
              raise SystemExit('expected V2 Kg assertion not found')
          p.write_text(s.replace(old, new, 1))
          for name in [
              'client/e2e-forge/auth-tests/purchase-fifo-lifecycle.spec.ts',
              'client/e2e-forge/auth-tests/purchase-bulk-transaction.spec.ts',
          ]:
              q = Path(name)
              t = q.read_text()
              q.write_text(t.replace('material_specification: "AL71",', 'material_specification: "AL71-QA-SPEC",'))
          PY
      - name: Commit one-shot convergence
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add server/tests/alumdoor-item-model.test.mjs client/e2e-forge/auth-tests/purchase-fifo-lifecycle.spec.ts client/e2e-forge/auth-tests/purchase-bulk-transaction.spec.ts
          git diff --cached --check
          git commit -m "test(alumdoor): converge V2 aluminum package expectations"
          git push origin "HEAD:${HEAD_BRANCH}"
