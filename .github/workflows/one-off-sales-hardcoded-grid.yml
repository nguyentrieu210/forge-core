name: One-off Sales hardcoded grid
on:
  push:
    branches: [ui/sales-hardcoded-grid]
permissions:
  contents: write
jobs:
  patch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ui/sales-hardcoded-grid
      - shell: powershell
        run: |
          @'
          from pathlib import Path
          p = Path('client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<article key={line._key} className="overflow-hidden rounded-lg border bg-card">','<article key={line._key} className="overflow-hidden rounded-md border bg-card">')
          s = s.replace('className="flex min-h-9 items-center justify-between gap-2 border-b bg-muted/25 px-2.5 py-1.5"','className="flex min-h-8 items-center justify-between gap-2 border-b bg-muted/20 px-2 py-1"')
          s = s.replace('className="grid size-6 shrink-0 place-items-center rounded-full bg-foreground text-[11px] font-semibold text-background"','className="grid size-5 shrink-0 place-items-center rounded bg-foreground text-[10px] font-semibold text-background"')
          s = s.replace('className="space-y-2 p-2.5"','className="space-y-1.5 p-2"')
          s = s.replace('className="grid gap-2 md:grid-cols-2 xl:grid-cols-12"','className="grid items-end gap-1.5 md:grid-cols-2 xl:grid-cols-12"',1)
          s = s.replace('className={text(line.item_code) ? "md:col-span-2 xl:col-span-5" : "md:col-span-2 xl:col-span-8"}','className={text(line.item_code) ? "md:col-span-2 xl:col-span-4" : "md:col-span-2 xl:col-span-6"}')
          s = s.replace('className="md:col-span-2 xl:col-span-3"','className="md:col-span-2 xl:col-span-2"',1)
          s = s.replace('className="grid gap-2 rounded-md border bg-muted/10 p-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6"','className="grid items-end gap-1.5 border-t bg-muted/10 px-2 py-1.5 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-8"',1)
          s = s.replace('className="flex flex-wrap items-center justify-end gap-x-3 gap-y-1 rounded-md bg-muted/20 px-2.5 py-1.5 text-[11px] tabular-nums"','className="flex flex-wrap items-center justify-end gap-x-2 gap-y-1 border-t px-2 py-1 text-[10px] tabular-nums"')
          p.write_text(s, encoding='utf-8', newline='\n')
          '@ | python -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx
          git rm .github/workflows/one-off-sales-hardcoded-grid.yml
          git commit -m "refactor(ui): compact hardcoded Sales Order lines"
          git push origin HEAD:ui/sales-hardcoded-grid
