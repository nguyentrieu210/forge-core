name: Sales Commercial Complete Validation

on:
  pull_request:
    branches:
      - exp/alumdoor-pricing-policy

permissions:
  contents: read

concurrency:
  group: sales-commercial-complete-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sales-commercial-complete-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Server build
        working-directory: server
        run: pnpm run build
      - name: Commercial targeted tests
        working-directory: server
        run: |
          node --test tests/commercial-line-resolver.test.mjs tests/commercial-line-price-variant.test.mjs tests/sales-option-resolver.test.mjs tests/sales-order-pricing-authority.test.mjs
      - name: SQL migration replay
        working-directory: server
        run: pnpm run test:sql
      - name: Brief verification
        working-directory: server
        run: pnpm run brief:check
