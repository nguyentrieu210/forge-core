name: One-off AlumDoor standard controls

on:
  push:
    branches: [ui/alumdoor-standard-controls]
    paths: [.github/workflows/one-off-alumdoor-standard-controls.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted]
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refactor Sales Order TSX to Forge controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'C:\alumdoor-hardcode-preview'
          $branch = 'ui/alumdoor-standard-controls'
          $remote = 'https://github.com/nguyentrieu210/forge.git'

          git -C $repo remote set-url origin $remote
          git -C $repo fetch origin $branch --prune
          git -C $repo checkout -B $branch "origin/$branch"
          git -C $repo reset --hard "origin/$branch"

          $nodeScript = @'
          const fs = require('fs');
          const file = 'C:/alumdoor-hardcode-preview/client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx';
          let source = fs.readFileSync(file, 'utf8');

          function replaceOnce(pattern, replacement, label) {
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`Pattern not found: ${label}`);
            source = next;
          }

          replaceOnce(
            'import { useCallback, useEffect, useMemo, useRef, useState, type ReactNode } from "react";',
            'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
            'react import',
          );
          source = source.replace('  linkDisplay,\n', '').replace('  type LinkResult,\n', '');
          replaceOnce(
            'import { Button, Input, toast } from "@metaforge/ui";',
            'import type { ControlRegistry, FieldServices } from "@metaforge/controls";\nimport { Button, toast } from "@metaforge/ui";',
            'control imports',
          );

          replaceOnce(/function numeric\(value: string\): number \| undefined \{[\s\S]*?\n\}\n\n/, '', 'remove numeric helper');
          replaceOnce(/function openLinkedCreate\(doctype: string\) \{[\s\S]*?\n\}\n\n/, '', 'remove linked create helper');

          const standardControls = String.raw`function fallbackField(
            fieldname: string,
            label: string,
            fieldtype: DocField["fieldtype"] = "Data",
            options?: string,
          ): DocField {
            return { fieldname, label, fieldtype, ...(options ? { options } : {}) } as DocField;
          }

          function selectField(
            base: DocField | undefined,
            fieldname: string,
            label: string,
            options: string[],
            optionLabels?: Record<string, string>,
          ): DocField {
            const unique = [...new Set(options.map(text).filter(Boolean))];
            return {
              ...(base ?? fallbackField(fieldname, label)),
              fieldname,
              label,
              fieldtype: "Select",
              options: ["", ...unique].join("\n"),
              ...(optionLabels ? { optionLabels } : {}),
            } as DocField;
          }

          function StandardField(props: {
            id: string;
            field: DocField;
            value: unknown;
            onChange: (value: unknown) => void;
            registry: ControlRegistry;
            services: FieldServices;
            parentDoctype: string;
            docValues: Json;
            roles: string[];
            label?: string;
            required?: boolean;
            readOnly?: boolean;
            compact?: boolean;
            className?: string;
            onCommit?: () => void;
          }) {
            const Control = props.registry.resolve(props.field.fieldtype);
            const displayLabel = props.label || text(props.field.label) || props.field.fieldname;
            if (!Control) {
              return <div className={props.className}><div className="text-xs text-destructive">Chưa có control cho {props.field.fieldtype}</div></div>;
            }
            const control = (
              <Control
                field={props.field}
                id={props.id}
                value={props.value}
                onChange={props.onChange}
                readOnly={props.readOnly}
                required={props.required}
                label={displayLabel}
                services={props.services}
                parentDoctype={props.parentDoctype}
                docValues={props.docValues}
                roles={props.roles}
                compact={props.compact}
              />
            );
            if (props.field.fieldtype === "Check") {
              return (
                <div className={"min-w-0 " + (props.className ?? "")}>
                  <div className="flex h-9 items-center gap-2">
                    {control}
                    <label htmlFor={props.id} className="cursor-pointer text-[13px] font-medium text-foreground">
                      {displayLabel}{props.required ? <span className="ml-0.5 text-destructive">*</span> : null}
                    </label>
                  </div>
                </div>
              );
            }
            return (
              <div
                className={"min-w-0 " + (props.className ?? "")}
                onBlurCapture={() => props.onCommit?.()}
                onKeyDownCapture={(event) => { if (event.key === "Enter") props.onCommit?.(); }}
              >
                <label htmlFor={props.id} className="mb-1 block text-[13px] font-medium leading-tight text-foreground">
                  {displayLabel}{props.required ? <span className="ml-0.5 text-destructive">*</span> : null}
                </label>
                {control}
              </div>
            );
          }

          export function AlumdoorSalesOrderCreate`;

          replaceOnce(/function Label\([\s\S]*?\nexport function AlumdoorSalesOrderCreate/, standardControls, 'replace custom controls');

          replaceOnce(
            '  const { adapter, scopeKey, businessContext, contextPolicies } = useMetaForge();',
            '  const { adapter, scopeKey, businessContext, contextPolicies, registry, services, roles } = useMetaForge();',
            'provider destructure',
          );
          source = source.replace('  const [customerLabel, setCustomerLabel] = useState("");\n', '');
          source = source.replace('  const [employeeLabel, setEmployeeLabel] = useState("");\n', '');
          source = source.replace('        setEmployeeLabel(text(defaults.responsible_person));\n', '');
          replaceOnce(
            /\.then\(\(resolved\) => \{\n\s*setHeader\(resolved\);\n\s*if \(field === "customer"\) \{\n\s*setEmployeeLabel\(text\(resolved\.responsible_person\)\);\n\s*\}\n\s*\}\)/,
            '.then((resolved) => setHeader(resolved))',
            'remove employee label sync',
          );

          replaceOnce(
            /  const metaField = \(fieldname: string\) => meta\.fields\.find\(\(field\) => field\.fieldname === fieldname\);\n  const metaLabel = \(fieldname: string, fallback: string\) => text\(metaField\(fieldname\)\?\.label\) \|\| fallback;\n  const metaRequired = \(fieldname: string\) => Boolean\(metaField\(fieldname\)\?\.reqd\);/,
            `  const metaField = (fieldname: string) => meta.fields.find((field) => field.fieldname === fieldname);\n  const childField = (fieldname: string) => childMeta.fields.find((field) => field.fieldname === fieldname);\n  const headerField = (fieldname: string, label: string, fieldtype: DocField["fieldtype"] = "Data", options?: string) =>\n    metaField(fieldname) ?? fallbackField(fieldname, label, fieldtype, options);\n  const lineBaseField = (fieldname: string, label: string, fieldtype: DocField["fieldtype"] = "Data", options?: string) =>\n    childField(fieldname) ?? fallbackField(fieldname, label, fieldtype, options);\n  const metaRequired = (fieldname: string) => Boolean(metaField(fieldname)?.reqd);`,
            'field helpers',
          );

          const headerBlock = String.raw`<section className="rounded-lg border bg-card p-3" data-section="sales-customer-meta-header">
            <div className="mb-2 flex items-center justify-between gap-3">
              <h2 className="text-sm font-semibold">Thông tin khách hàng</h2>
              <span className="text-[11px] text-muted-foreground">Đơn bán hàng mới</span>
            </div>

            <div className="grid gap-2 md:grid-cols-2 xl:grid-cols-[minmax(320px,2.2fr)_minmax(150px,.8fr)_minmax(260px,1.5fr)_150px_150px]">
              <StandardField
                id="sales-customer"
                field={headerField("customer", "Khách hàng", "Link", "Customer")}
                value={header.customer}
                onChange={(value) => setHeaderField("customer", text(value) || undefined, true)}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                required={metaRequired("customer")}
                className="xl:order-1"
              />

              <StandardField
                id="sales-phone"
                field={salesPhoneField ? headerField(salesPhoneField, "SĐT") : fallbackField("__customer_phone", "SĐT")}
                value={phoneValue}
                onChange={(value) => {
                  const phone = text(value);
                  setCustomerPhone(phone);
                  if (salesPhoneField) setHeaderField(salesPhoneField, phone || undefined);
                }}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                readOnly={!salesPhoneField}
                className="xl:order-2"
              />

              <StandardField
                id="sales-address"
                field={headerField("install_address", "Địa chỉ giao / lắp đặt")}
                value={header.install_address}
                onChange={(value) => setHeaderField("install_address", text(value) || undefined)}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                required={metaRequired("install_address")}
                label="Địa chỉ giao / lắp đặt"
                className="md:col-span-2 xl:order-6 xl:col-span-5"
              />

              <StandardField
                id="sales-order-date"
                field={headerField("transaction_date", "Ngày đặt hàng", "Date")}
                value={header.transaction_date}
                onChange={(value) => setHeaderField("transaction_date", text(value), true)}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                required={metaRequired("transaction_date")}
                label="Ngày đặt hàng"
                className="xl:order-4"
              />

              <StandardField
                id="sales-delivery-date"
                field={headerField("delivery_date", "Ngày giao", "Date")}
                value={header.delivery_date}
                onChange={(value) => setHeaderField("delivery_date", text(value))}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                required={metaRequired("delivery_date")}
                label="Ngày giao"
                className="xl:order-5"
              />

              <StandardField
                id="sales-responsible-person"
                field={headerField("responsible_person", "Nhân viên bán hàng", "Link", "Employee")}
                value={header.responsible_person}
                onChange={(value) => setHeaderField("responsible_person", text(value) || undefined)}
                registry={registry}
                services={services}
                parentDoctype="Sales Order"
                docValues={header}
                roles={roles}
                required={metaRequired("responsible_person")}
                label="Nhân viên bán hàng"
                className="md:col-span-2 xl:order-3 xl:col-span-1"
              />
            </div>
          </section>

          <section className="space-y-2" data-section="hardcoded-sales-lines">`;

          replaceOnce(
            /<section className="rounded-lg border bg-card p-3" data-section="sales-customer-meta-header">[\s\S]*?<\/section>\n\n          <section className="space-y-2" data-section="hardcoded-sales-lines">/,
            headerBlock,
            'header block',
          );

          const itemRow = String.raw`<div className="grid gap-2 md:grid-cols-2 xl:grid-cols-12">
                      <StandardField
                        id={\`sales-line-\${index}-item\`}
                        field={lineBaseField("item_code", "Mặt hàng", "Link", "Item")}
                        value={line.item_code}
                        onChange={(value) => {
                          const itemCode = text(value);
                          const reset: Partial<SalesLine> = {
                            item_code: itemCode || undefined,
                            _itemLabel: undefined,
                            sales_option: undefined,
                            _context: undefined,
                            _salesOptions: [],
                            _allowedColors: [],
                            _overrides: {},
                            _error: "",
                          };
                          patchLine(line._key, reset);
                          if (itemCode) void previewLine({ ...line, ...reset } as SalesLine, "item_code", reset);
                        }}
                        registry={registry}
                        services={services}
                        parentDoctype="Sales Order"
                        docValues={{ ...header, ...line }}
                        roles={roles}
                        required
                        compact
                        label="Mặt hàng"
                        className={text(line.item_code) ? "md:col-span-2 xl:col-span-5" : "md:col-span-2 xl:col-span-8"}
                      />

                      {salesOptions.length ? (
                        <StandardField
                          id={\`sales-line-\${index}-sales-option\`}
                          field={selectField(
                            childField("sales_option"),
                            "sales_option",
                            "Phương án bán",
                            salesOptions.map((option) => String(option.name)),
                            Object.fromEntries(salesOptions.map((option) => [String(option.name), text(option.option_label) || String(option.name)])),
                          )}
                          value={line.sales_option}
                          onChange={(value) => commitLine(line._key, "sales_option", text(value) || undefined)}
                          registry={registry}
                          services={services}
                          parentDoctype="Sales Order Item"
                          docValues={line}
                          roles={roles}
                          label="Phương án bán"
                          className="md:col-span-2 xl:col-span-3"
                        />
                      ) : null}

                      {colors.length ? (
                        <StandardField
                          id={\`sales-line-\${index}-color\`}
                          field={selectField(childField("color"), "color", "Màu", colors)}
                          value={line.color}
                          onChange={(value) => commitLine(line._key, "color", text(value) || undefined)}
                          registry={registry}
                          services={services}
                          parentDoctype="Sales Order Item"
                          docValues={line}
                          roles={roles}
                          label="Màu"
                          className="xl:col-span-2"
                        />
                      ) : null}

                      {uoms.length ? (
                        <StandardField
                          id={\`sales-line-\${index}-uom\`}
                          field={selectField(childField("uom"), "uom", "ĐVT", uoms)}
                          value={line.uom}
                          onChange={(value) => commitLine(line._key, "uom", text(value) || undefined)}
                          registry={registry}
                          services={services}
                          parentDoctype="Sales Order Item"
                          docValues={line}
                          roles={roles}
                          label="ĐVT"
                          className="xl:col-span-2"
                        />
                      ) : text(line.uom) ? (
                        <StandardField
                          id={\`sales-line-\${index}-uom\`}
                          field={fallbackField("uom", "ĐVT")}
                          value={line.uom}
                          onChange={() => undefined}
                          registry={registry}
                          services={services}
                          parentDoctype="Sales Order Item"
                          docValues={line}
                          roles={roles}
                          readOnly
                          label="ĐVT"
                          className="xl:col-span-2"
                        />
                      ) : null}
                    </div>

                    {text(line.item_code) ? (`;

          replaceOnce(
            /<div className="grid gap-2 md:grid-cols-2 xl:grid-cols-12">[\s\S]*?<\/div>\n\n                    \{text\(line\.item_code\) \? \(/,
            itemRow,
            'item control row',
          );

          const configRow = String.raw`{text(line.item_code) ? (
                      <div className="grid gap-2 rounded-md border bg-muted/10 p-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6">
                        {showWidth ? (
                          <StandardField
                            id={\`sales-line-\${index}-width\`}
                            field={lineBaseField("width_m", fieldLabel(line, "width_m", "Rộng (m)"), "Float")}
                            value={line.width_m}
                            onChange={(value) => patchLine(line._key, { width_m: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "width_m", line.width_m)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required={area || fieldRequired(line, "width_m")} readOnly={fieldReadonly(line, "width_m")}
                            label={fieldLabel(line, "width_m", "Rộng (m)")}
                          />
                        ) : null}

                        {showHeight ? (
                          <StandardField
                            id={\`sales-line-\${index}-height\`}
                            field={lineBaseField("height_m", fieldLabel(line, "height_m", "Cao (m)"), "Float")}
                            value={line.height_m}
                            onChange={(value) => patchLine(line._key, { height_m: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "height_m", line.height_m)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required={area || fieldRequired(line, "height_m")} readOnly={fieldReadonly(line, "height_m")}
                            label={fieldLabel(line, "height_m", "Cao (m)")}
                          />
                        ) : null}

                        {showSets ? (
                          <StandardField
                            id={\`sales-line-\${index}-sets\`}
                            field={lineBaseField("set_count", fieldLabel(line, "set_count", area ? "Số bộ" : "Số lượng"), "Int")}
                            value={line.set_count}
                            onChange={(value) => patchLine(line._key, { set_count: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "set_count", line.set_count)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required={area || fieldRequired(line, "set_count")} readOnly={fieldReadonly(line, "set_count")}
                            label={fieldLabel(line, "set_count", area ? "Số bộ" : "Số lượng")}
                          />
                        ) : null}

                        {showSalesMode ? (
                          <StandardField
                            id={\`sales-line-\${index}-sales-mode\`}
                            field={selectField(childField("sales_mode"), "sales_mode", "Cách bán", salesModes)}
                            value={line.sales_mode || "Trọn bộ"}
                            onChange={(value) => commitLine(line._key, "sales_mode", text(value) || undefined)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            label="Cách bán"
                          />
                        ) : null}

                        {showLeafVariant ? (
                          <StandardField
                            id={\`sales-line-\${index}-leaf-variant\`}
                            field={selectField(childField("leaf_variant"), "leaf_variant", "Kiểu kéo / motor", leafVariants)}
                            value={line.leaf_variant}
                            onChange={(value) => commitLine(line._key, "leaf_variant", text(value) || undefined)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            label="Kiểu kéo / motor"
                          />
                        ) : null}

                        {kind === "mesh" ? (
                          <StandardField
                            id={\`sales-line-\${index}-mesh-height\`}
                            field={lineBaseField("mesh_height_m", "Cao lưới (m)", "Float")}
                            value={line.mesh_height_m}
                            onChange={(value) => patchLine(line._key, { mesh_height_m: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "mesh_height_m", line.mesh_height_m)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            label="Cao lưới (m)"
                          />
                        ) : null}

                        {fieldVisible(line, "has_butterfly_bracket") ? (
                          <StandardField
                            id={\`sales-line-\${index}-butterfly\`}
                            field={lineBaseField("has_butterfly_bracket", "Có bản bướm", "Check")}
                            value={line.has_butterfly_bracket}
                            onChange={(value) => commitLine(line._key, "has_butterfly_bracket", value ? 1 : 0)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            readOnly={fieldReadonly(line, "has_butterfly_bracket")}
                            label="Có bản bướm"
                          />
                        ) : null}

                        {showLength ? (
                          <StandardField
                            id={\`sales-line-\${index}-length\`}
                            field={lineBaseField("length_m", fieldLabel(line, "length_m", "Dài một cây/đoạn (m)"), "Float")}
                            value={line.length_m}
                            onChange={(value) => patchLine(line._key, { length_m: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "length_m", line.length_m)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required={fieldRequired(line, "length_m")} readOnly={fieldReadonly(line, "length_m")}
                            label={fieldLabel(line, "length_m", "Dài một cây/đoạn (m)")}
                          />
                        ) : null}

                        {showBars ? (
                          <StandardField
                            id={\`sales-line-\${index}-bars\`}
                            field={lineBaseField("qty_bar", fieldLabel(line, "qty_bar", "Số cây/đoạn"), "Int")}
                            value={line.qty_bar}
                            onChange={(value) => patchLine(line._key, { qty_bar: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "qty_bar", line.qty_bar)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required={fieldRequired(line, "qty_bar")} readOnly={fieldReadonly(line, "qty_bar")}
                            label={fieldLabel(line, "qty_bar", "Số cây/đoạn")}
                          />
                        ) : null}

                        {!area && !showSets && !showBars ? (
                          <StandardField
                            id={\`sales-line-\${index}-qty\`}
                            field={lineBaseField("qty", "Khối lượng", "Float")}
                            value={line.qty}
                            onChange={(value) => patchLine(line._key, { qty: value == null || value === "" ? undefined : Number(value) })}
                            onCommit={() => commitLine(line._key, "qty", line.qty)}
                            registry={registry} services={services} parentDoctype="Sales Order Item" docValues={line} roles={roles}
                            required readOnly={fieldReadonly(line, "qty")}
                            label="Khối lượng"
                          />
                        ) : null}
                      </div>
                    ) : null}

                    {line._error ?`;

          replaceOnce(
            /\{text\(line\.item_code\) \? \(\n\s*<div className="grid gap-2 rounded-md border bg-muted\/10 p-2 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6">[\s\S]*?<\/div>\n\s*\) : null\}\n\n\s*\{line\._error \?/,
            configRow,
            'configuration controls',
          );

          if (/LinkPicker|SelectBox|NumberBox|customerLabel|employeeLabel|openLinkedCreate|linkDisplay|LinkResult/.test(source)) {
            throw new Error('Legacy custom controls still referenced after refactor');
          }

          fs.writeFileSync(file, source, 'utf8');
          '@

          $nodeScript | node

          git -C $repo rm '.github/workflows/one-off-alumdoor-standard-controls.yml'
          git -C $repo add 'client/packages/views/src/app/vertical/alumdoor/AlumdoorSalesOrderCreate.tsx'
          git -C $repo config user.name 'github-actions[bot]'
          git -C $repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $repo commit -m 'refactor(ui): use standard Forge controls in AlumDoor sales order'

          git -C $repo remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/nguyentrieu210/forge.git"
          git -C $repo push origin "HEAD:$branch"
          git -C $repo remote set-url origin $remote
